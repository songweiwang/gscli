name: gscli

on:
  pull_request:
    paths-ignore:
      - '**.rst'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10"]

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: |
          pip install -U pip setuptools
          pip install --no-cache-dir ".[sshtunnel]"
          pip install -r requirements-dev.txt
          pip install keyrings.alt>=3.1

      - name: Run unit tests
        run: coverage run --source gscli -m py.test

      - name: Check changelog for ReST compliance
        run: rst2html.py --halt=warning changelog.rst >/dev/null

      - name: Run Black
        run: pip install black && black --check .
        if: matrix.python-version == '3.8'

      - name: Coverage
        run: |
          coverage combine
          coverage report
          codecov
